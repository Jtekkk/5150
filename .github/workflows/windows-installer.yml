name: Windows Installer

# Builds Redline 120 on a Windows runner (MSVC, x64), packages it with Inno
# Setup, and uploads the finished installer .exe as a downloadable artifact.
# Run it from the Actions tab (workflow_dispatch), on a tag push (v*), or on
# pushes to the development branches below.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/6l6-amp-simulator-vst-nq4uzh
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64)
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DREDLINE_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin (VST3 + Standalone, Release)
        run: cmake --build build --config Release --target Redline120_All --parallel

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\windows\Redline120.iss"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redline120-Windows-x64-Installer
          path: installer/windows/Output/*.exe
          if-no-files-found: error

      # On a version tag, also attach the installer to a GitHub Release.
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/Output/*.exe
